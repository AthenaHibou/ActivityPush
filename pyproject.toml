[project]
name = "ActivityPush"
version = "1.0.0"
description = "GsCore 游戏活动查询与到期提醒插件（原神/星穹铁道/绝区零/鸣潮/异环/终末地）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "AthenaHibou" }]

dependencies = [
    "httpx>=0.24.0",
    "pillow>=10.2.0",
    "aiofiles>=0.8.0",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/AthenaHibou/ActivityPush"
Repository = "https://github.com/AthenaHibou/ActivityPush"
Issues = "https://github.com/AthenaHibou/ActivityPush/issues"
